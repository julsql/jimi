# Configuration gitleaks (job "secrets commis" de security.yml).
# Regles par defaut, plus une exception ciblee.

[extend]
useDefault = true

# Podfile.lock liste un checksum SHA-1 par podspec (`Pod-Name: <40 hex>`) :
# generic-api-key les prend pour des cles. Seules ces lignes sont ignorees.
[[allowlists]]
description = "CocoaPods podspec checksums"
condition = "AND"
paths = ['''(^|/)ios/Podfile\.lock$''']
regexTarget = "line"
regexes = ['''^\s+[A-Za-z0-9_+./-]+: [0-9a-f]{40}$''']
