# API Spring Boot : tests, puis image.
#
# Remplace apps/api/.github/workflows/docker.yml, devenu inerte : GitHub ne lit
# que .github/workflows/ a la racine du depot.
#
# Le nom d'image suit le schema monorepo <owner>/<repo>/<image> : GHCR rattache
# alors le package a julsql/jimi, ce qui donne au GITHUB_TOKEN de CE depot le
# droit d'y pousser, sans PAT.
name: api

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: julsql/jimi/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B -q test
        working-directory: apps/api
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: api-surefire-reports
          path: apps/api/target/surefire-reports/
          retention-days: 7

  build-push:
    name: build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    # Le contexte `secrets` n'est pas accessible depuis un `if:` de step : on le
    # recopie ici pour pouvoir tester sa presence plus bas.
    env:
      KEEL_AUTH: ${{ secrets.KEEL_WEBHOOK_AUTH }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Notify Keel to redeploy
        if: env.KEEL_AUTH != ''
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            https://keel.julsql.fr/v1/webhooks/native \
            -u "$KEEL_AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"name":"ghcr.io/${{ env.IMAGE_NAME }}","tag":"latest"}'

      - name: Keel secret missing
        if: env.KEEL_AUTH == ''
        run: |
          echo "::warning::KEEL_WEBHOOK_AUTH absent : image poussee mais deploiement non declenche."
