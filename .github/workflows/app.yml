# Client Expo (web, iOS, Android) : typecheck, puis image web.
#
# Seule la cible web est deployee par la CI. Les builds natifs (Play Store,
# App Store) restent manuels : voir apps/app/README.md.
name: app

on:
  push:
    branches: [main]
    paths: ["apps/app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["apps/app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: julsql/jimi/app
  # Bakee dans le bundle JS au build : l'image est propre a l'environnement.
  EXPO_PUBLIC_API_URL: https://jimi-api.julsql.fr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/app
      - run: npm run typecheck
        working-directory: apps/app
      - run: npm run build:web
        working-directory: apps/app

  build-push:
    name: build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      KEEL_AUTH: ${{ secrets.KEEL_WEBHOOK_AUTH }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: apps/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXPO_PUBLIC_API_URL=${{ env.EXPO_PUBLIC_API_URL }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Notify Keel to redeploy
        if: env.KEEL_AUTH != ''
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            https://keel.julsql.fr/v1/webhooks/native \
            -u "$KEEL_AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"name":"ghcr.io/${{ env.IMAGE_NAME }}","tag":"latest"}'

      - name: Keel secret missing
        if: env.KEEL_AUTH == ''
        run: |
          echo "::warning::KEEL_WEBHOOK_AUTH absent : image poussee mais deploiement non declenche."
