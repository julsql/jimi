# Mises a jour de dependances, groupees par ecosysteme pour limiter le bruit.
version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
    # Une majeure (Spring Boot 4, springdoc 3, ShedLock 7...) est une migration,
    # pas une mise a jour : elle se fait a la main, dans sa propre PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven:
        patterns: ["*"]
    commit-message:
      prefix: "chore(api)"

  - package-ecosystem: npm
    directory: /apps/app
    schedule:
      interval: weekly
    # Expo fige ses versions par SDK : les majeures passent par `npx expo
    # install --fix` lors d'une montee de SDK, pas par Dependabot. Pour
    # react-native (0.x) et React, une mineure est deja une rupture de SDK.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor"]
      # react et react-dom sont figes a la version exacte du renderer embarque
      # par react-native (19.2.0 pour le SDK 55) : meme un patch casse le natif.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-minor"]
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(app)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
